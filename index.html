<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Derivados de `assets/marca/logometup.png` por `npm run images`. O master tem
         1080×1080 e 397 kB: servi-lo como favicon custava 397 kB em TODA visita, num
         site cujo LCP mobile já está a 0,1s do limite (CLAUDE.md §6.2). São 2 kB. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/marca/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/marca/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cor de identidade na barra do navegador mobile (--color-bg). -->
    <meta name="theme-color" content="#050505" />

    <!-- TODO(PENDENCIAS.md #seo-copy): title/description finais dependem da copy oficial do Davi -->

    <meta
      name="description"
      content="Metup é uma agência de soluções web: sites, aplicativos, automações e sistemas sob demanda."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metup" />
    <meta property="og:title" content="Metup — sites, apps, automações e sistemas sob demanda" />
    <meta
      property="og:description"
      content="Metup é uma agência de soluções web: sites, aplicativos, automações e sistemas sob demanda."
    />
    <!-- TODO(PENDENCIAS.md #og-image): imagem de OG real (1200x630) -->
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metup — sites, apps, automações e sistemas sob demanda" />
    <meta
      name="twitter:description"
      content="Metup é uma agência de soluções web: sites, aplicativos, automações e sistemas sob demanda."
    />

    <!-- Telefone real do Davi (2026-08-31), em E.164 — o mesmo número do CTA, que já
         vai público no link do WhatsApp. Fonte única em `src/lib/contact.ts`: se ele
         mudar lá, mude aqui junto (o HTML estático não lê o TS).

         E-mail: grupometup@gmail.com (2026-09-01, decisão explícita do Davi de
         publicar já — ver PENDENCIAS.md "E-mail público no JSON-LD"). É TEMPORÁRIO:
         quando contato@metup.com.br existir e estiver recebendo, troca aqui E no
         destino do formulário (`.env`, VITE_LEAD_ACCESS_KEY do Web3Forms). O Google
         pode manter o Gmail em cache por um tempo mesmo depois da troca — contado.

         TODO(PENDENCIAS.md #jsonld): falta endereço e redes reais. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Metup",
        "description": "Agência de soluções web: sites, aplicativos, automações e sistemas sob demanda.",
        "areaServed": "BR",
        "telephone": "+5551998679260",
        "email": "grupometup@gmail.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "telephone": "+5551998679260",
          "email": "grupometup@gmail.com",
          "availableLanguage": "pt-BR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
